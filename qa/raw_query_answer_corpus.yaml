  # --- Compound event and filter routing integrity -------------------------
  # Each of these returned a confident wrong answer before the compound-event
  # boundary existed. The expectations prove the two halves of the contract:
  # a request that can be executed whole is, and one that cannot returns no
  # answer rows, no substituted metric, and the parts it could not run.

  - id: team_compound_occurrence_elliptical_verbs
    query: "teams with most games scoring 120+ and making 15+ threes since 2020"
    category: leaderboard
    priority: p0
    acceptance:
      family: count_queries
      variant: canonical
      concept: team_multi_threshold_occurrence_leaderboard
      public_surface: true
      review_required: true
      review_role: supporting
      no_broad_fallback: true
      intent_model: team_occurrence_leaders
      qualifier_model:
        - points_threshold
        - three_pointers_threshold
        - since_season
    answer_text_policy: frontend_hero_expected
    expected_status: ok
    expected_route: team_occurrence_leaders
    expected_shape: leaderboard_table
    expected_filters:
      - kind: threshold
        label: pts min
        value: "120.0"
      - kind: threshold
        label: fg3m min
        value: "15.0"
      - kind: season
    expected_sections:
      - leaderboard
    hard_assertions:
      # Ranked by how many games matched, not by either threshold metric.
      - path: result.metadata.ranking_key
        equals: occurrence_count
      # No condition metric is published as the answer's metric.
      - path: result.metadata.stat
        equals: null
    review_notes: "Verb-elliptical compound thresholds ('scoring 120+', 'making 15+ threes') must both execute and rank by matching-game count. This returned a league FG3M-per-game leaderboard before the compound-event boundary."
    manual_review:
      status: unreviewed
      tags:
        - compound_occurrence
        - no_broad_fallback
      notes: "Confirm both thresholds appear in the count column and the date scope starts at 2020-21."

