version: 1

# Optional manual-review metadata:
# manual_review.status allowed values:
# - unreviewed
# - pass
# - verified_outlier
# - needs_followup
# - semantics_issue
# - data_quality_question
# - routing_issue
# - missing_filter
# - wrong_shape
# - bad_answer_text
# - expected_unsupported
# - needs_product_decision
#
# Optional answer_text_policy allowed values:
# - requires_backend_answer_text
# - frontend_hero_expected
# - no_answer_text_expected
#
# Optional product-review acceptance metadata is validated by
# tools/raw_query_answer_qa.py. See qa/raw_query_answer_acceptance_families.yaml.

cases:
  - id: record_when_jokic_triple_double
    query: "What is Denver's record when Nikola Jokic has a triple-double?"
    category: record_when_player_condition
    priority: p0
    answer_text_policy: frontend_hero_expected
    expected_status: ok
    expected_route: player_game_summary
    expected_shape: entity_summary
    expected_filters:
      - kind: special_event
        label: Special Event
        value: Triple Double
    expected_sections:
      - summary
      - game_log
    expected_row_counts:
      summary: 1
      game_log: 34
    hard_assertions:
      - path: result.sections.summary.0.games
        equals: 34
      - path: result.sections.summary.0.wins
        equals: 24
      - path: result.sections.summary.0.losses
        equals: 10
    review_notes: "Regression guard for stale unfiltered 65-game, 43-22 answer."

  - id: jokic_triple_double_count
    query: "How often has Nikola Jokic recorded a triple-double this season?"
    category: player_game_log_count
    priority: p0
    acceptance:
      family: count_queries
      variant: canonical
      concept: player_event_count
      public_surface: true
      review_required: true
      review_role: representative
      no_broad_fallback: true
      intent_model: player_game_finder
      qualifier_model:
        - triple_double
        - current_season
    answer_text_policy: requires_backend_answer_text
    expected_status: ok
    expected_route: player_game_finder
    expected_shape: count_with_finder
    expected_filters:
      - kind: special_event
        label: Special Event
        value: Triple Double
    expected_sections:
      - count
      - finder
    expected_row_counts:
      count: 1
      finder: 34
    hard_assertions:
      - path: result.sections.count.0.count
        equals: 34
    review_notes: "Count phrase should come from backend metadata, not frontend hero text."

