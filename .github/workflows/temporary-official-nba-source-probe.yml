name: NBA official report PDF extraction (temporary read-only probe)
on:
  push:
    branches: ["ops/availability-source-probe-20261016"]
permissions:
  contents: read
jobs:
  scorer-report-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install small pure-Python PDF parser
        run: python -m pip install "pypdf>=5,<7"
      - name: Inspect per-game DNP / inactive report structure
        shell: bash
        run: |
          python - <<'PY'
          import io
          import urllib.request
          from pypdf import PdfReader
          for link in [
            "https://statsdmz.nba.com/pdfs/20251021/20251021_GSWLAL.pdf",
            "https://statsdmz.nba.com/pdfs/20250204/20250204_BOSCLE.pdf",
          ]:
              with urllib.request.urlopen(
                  urllib.request.Request(link,headers={"User-Agent":"Mozilla/5.0"}),
                  timeout=20,
              ) as response:
                  data=response.read(200000)
              reader=PdfReader(io.BytesIO(data),strict=True)
              text=reader.pages[0].extract_text(extraction_mode="layout")
              lines=text.splitlines()
              print("source:",link,"bytes",len(data),"pages",len(reader.pages),"lines",len(lines))
              for i,line in enumerate(lines):
                  if line.lstrip().startswith(("240:00","265:00","290:00","315:00")):
                      print("TOTALROW",i, " ".join(line.split())[-65:])
                  if line.lstrip().startswith("Inactive:"):
                      print("INACTIVE FIRST",i, " ".join(line.split())[:125])
                  if any(term in line for term in (
                      "NATIONAL BASKETBALL", "VISITOR:", "HOME:", "Inactive:",
                      "DNP -", "DND -", "FINAL BOX", "SCORE BY PERIOD",
                  )):
                      print("reportline:", i, " ".join(line.split())[:240])
          PY
