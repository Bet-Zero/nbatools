name: Official NBA source reachability (temporary probe)
on:
  push:
    branches: ["ops/availability-source-probe-20261016"]
permissions:
  contents: read
jobs:
  official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe official public NBA box scores without credentials
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          urls = {
              "NBA CDN live": "https://cdn.nba.com/static/json/liveData/boxscore/boxscore_0022400001.json",
              "NBA Stats V3": "https://stats.nba.com/stats/boxscoretraditionalv3?GameID=0022400001&StartPeriod=0&EndPeriod=0&StartRange=0&EndRange=0&RangeType=0",
          }
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36",
              "Referer": "https://www.nba.com/",
              "Origin": "https://www.nba.com",
          }
          ok = 0
          for label, url in urls.items():
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, headers=headers), timeout=18
                  ) as response:
                      raw = response.read(250000)
                      payload = json.loads(raw)
                  print(label, "status=200", "json_keys=", list(payload)[:8])
                  ok += 1
              except urllib.error.HTTPError as exc:
                  print(label, "HTTP status", exc.code)
              except Exception as exc:
                  print(label, type(exc).__name__, str(exc)[:200])
          if not ok:
              raise SystemExit("Neither official source is reachable from this runner")
          PY
