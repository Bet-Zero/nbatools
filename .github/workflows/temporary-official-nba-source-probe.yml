name: Historic game-day roster source reachability (temporary probe)
on:
  push:
    branches: ["ops/availability-source-probe-20261016"]
permissions:
  contents: read
jobs:
  historic-roster-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Sports Reference source once, no credentials or data publication
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error
          urls = [
              "https://www.basketball-reference.com/boxscores/202510210LAL.html",
              "https://www.basketball-reference.com/boxscores/201412290CHO.html",
          ]
          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36",
                      "Accept": "text/html",
                  })
                  with urllib.request.urlopen(request, timeout=12) as response:
                      raw = response.read(350000).decode("utf-8", errors="replace")
                      print(url, "status", response.status, "bytes", len(raw),
                            "did_not_play", "Did Not Play" in raw,
                            "inactive", "Inactive:" in raw)
              except urllib.error.HTTPError as exc:
                  print(url, "HTTP", exc.code)
              except Exception as exc:
                  print(url, type(exc).__name__, str(exc)[:120])
          PY
