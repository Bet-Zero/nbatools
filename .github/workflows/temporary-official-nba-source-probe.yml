name: NBA availability source reachability (temporary probe)
on:
  push:
    branches: ["ops/availability-source-probe-20261016"]
permissions:
  contents: read
jobs:
  alt-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe public NBA scoreboard and box-score completeness
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from collections import Counter

          base = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/"
          def get(s):
              req = urllib.request.Request(base + s, headers={
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36",
                  "Accept": "application/json",
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          try:
              board = get("scoreboard?dates=20251021")
              games = board.get("events", [])
              print("ESPN events:", [(game.get("id"), game.get("name")) for game in games])
              assert games, "No October 21 2025 NBA events"
              selected = next((g for g in games if "Lakers" in str(g.get("name"))), games[0])
              summary = get("summary?event=" + selected["id"])
              box = summary.get("boxscore") or {}
              statuses = []
              for team in box.get("players", []):
                  for group in team.get("statistics", []):
                      for p in group.get("athletes", []):
                          statuses.append((p.get("athlete", {}).get("displayName"), p.get("didNotPlay")))
              print("Summary game id:", selected["id"])
              print("Boxscore player rows:", len(statuses))
              print("didNotPlay flags:", dict(Counter(str(v) for _,v in statuses)))
              print("Sample reported DNP:", [name for name,flag in statuses if flag is True][:10])
              print("Summary sections:", list(summary.keys()))
              print("Boxscore sections:", list(box.keys()))
              print("Team summary:", [
                  (t.get("team", {}).get("abbreviation"), list(t.keys()))
                  for t in box.get("players", [])
              ])
              for team in box.get("players", []):
                  print("ESPN team id/abbr:", team.get("team", {}).get("id"), team.get("team", {}).get("abbreviation"))
                  for group in team.get("statistics", []):
                      print("Stat columns:", group.get("names"))
                      for player in group.get("athletes", [])[:2]:
                          print("Player example:", {
                              k: player.get(k) for k in ("didNotPlay", "stats", "starter", "inactive", "reason")
                          }, "athlete=", {
                              k: player.get("athlete", {}).get(k)
                              for k in ("id","displayName","fullName","status")
                          })
                  break
              older = get("scoreboard?dates=20150115")
              print("Older event count:", len(older.get("events", [])))
              if older.get("events"):
                  old_game = older["events"][0]
                  print("Older first event id:", old_game.get("id"))
                  old_summary = get("summary?event=" + old_game["id"])
                  print("Older boxscore team count:",len(old_summary.get("boxscore", {}).get("players", [])))

              assert statuses, "No player records in game summary"
              assert any(flag is True for _,flag in statuses), "No explicit nonparticipant flags in this sample"
          except Exception as exc:
              print("ESPN probe failed:", type(exc).__name__, str(exc)[:250])
              raise
          PY
