name: NBA API Reachability

# Manual, read-only check that GitHub's runners can reach the NBA stats
# endpoints a scheduled data refresh would call. No secrets, no writes.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to request, e.g. 2025-26"
        required: true
        default: "2025-26"
        type: string

permissions:
  contents: read

concurrency:
  group: nba-api-reachability
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install nba_api
        run: python -m pip install --quiet "nba_api>=1.5" pandas
      - name: Probe NBA stats endpoints
        env:
          SEASON: ${{ inputs.season }}
        run: |
          if ! [[ "$SEASON" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "Invalid season: $SEASON" >&2
            exit 2
          fi
          python tools/nba_api_reachability.py --season "$SEASON" --output reachability.json
      - name: Keep the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nba-api-reachability
          path: reachability.json
          if-no-files-found: ignore
