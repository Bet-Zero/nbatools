name: R2 Real-Data Validation
run-name: "R2 ${{ github.event_name == 'push' && 'automatic targeted' || inputs.scope }} validation of ${{ github.event_name == 'push' && github.sha || inputs.target_ref }}"

# Manual dispatch and bounded reviewed-candidate requests share this one path.
# These validation jobs and the extracted r2-publication-readonly.yml job use
# the existing bucket-scoped read-only NBA data credential in r2-validation.
# Keep ordinary CI secret-free.
#
# Credentials are secrets on the `r2-validation` GitHub Environment, not
# repository secrets, so they reach only the jobs that name that environment.
# Every data job below declares it; the request resolver is secret-free.
# A data job that omits it receives three empty
# strings and fails as though the data were gone. See
# docs/operations/deployment.md#github-actions-secrets.
#
# The gates run as parallel jobs rather than sequential steps. Run 1 proved why:
# the Raw QA corpus took 42m30s of a 45-minute budget, so the filter execution
# sweep was cancelled at pair 54 of 521 and the data-backed tests never started.
# Sequencing also buried the sweep - the highest-value trust check here - behind
# 43 minutes of Raw QA, so a sweep failure took most of an hour to surface.
# In parallel it reports in under ten minutes.
#
# Two scopes. `full` runs every gate and is for batch and merge points of
# query/data work: the whole Raw QA corpus is the long pole at roughly 30-40
# minutes. `targeted` is the per-change check: only the Raw QA cases and the
# needs_data tests a change names, which takes minutes, and no filter sweep.
on:
  workflow_call:
    inputs:
      publication_package:
        type: string
        required: true
      publication_mode:
        type: string
        required: true
      publication_publisher_sha:
        type: string
        required: true
      backup_generation:
        description: "Internal read-only backup after approved publication and live verification"
        type: string
        required: false
        default: ""
    secrets:
      R2_VALIDATION_ACCOUNT_ID:
        required: true
      R2_VALIDATION_ACCESS_KEY_ID:
        required: true
      R2_VALIDATION_SECRET_ACCESS_KEY:
        required: true
  push:
    branches: ["r2-validation/**"]
    paths: [".github/r2-validation-request.json"]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Same-repo branch, commit SHA, tag, or PR merge ref to validate"
        required: true
        default: "main"
        type: string
      scope:
        description: "full: every gate. targeted: only the cases and tests named below"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - targeted
      raw_qa_cases:
        description: "targeted: space-separated Raw QA case ids (empty skips Raw QA)"
        required: false
        default: ""
        type: string
      tests:
        description: "targeted: space-separated needs_data test files or node ids (empty skips them)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Full runs queue behind each other; a targeted run only waits for an earlier
# targeted run of the same ref, so a per-change check never sits behind a
# 40-minute replay.
concurrency:
  group: ${{ github.event_name == 'push' && 'r2-automatic-targeted' || inputs.scope == 'targeted' && format('r2-targeted-{0}', inputs.target_ref) || 'r2-real-data-validation' }}
  cancel-in-progress: false

env:
  DATA_SOURCE: r2
  R2_BUCKET_NAME: nbatools-data
  PYTHONUNBUFFERED: "1"

jobs:
  request:
    if: inputs.publication_package == ''
    name: Resolve and validate request without data credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      reviewed_sha: ${{ steps.resolve.outputs.reviewed_sha }}
      generation: ${{ steps.resolve.outputs.generation }}
      scope: ${{ steps.resolve.outputs.scope }}
      tests: ${{ steps.resolve.outputs.tests }}
      raw_qa_cases: ${{ steps.resolve.outputs.raw_qa_cases }}
      automatic: ${{ steps.resolve.outputs.automatic }}
    steps:
      - name: Check out the resolver from this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          persist-credentials: false
      - name: Check out the exact push or requested manual revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.backup_generation != '' && github.sha || github.event_name == 'push' && github.sha || inputs.target_ref }}
          fetch-depth: 2
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate request before installation or credential access
        id: resolve
        env:
          SCOPE: ${{ inputs.scope }}
          TESTS: ${{ inputs.tests }}
          RAW_QA_CASES: ${{ inputs.raw_qa_cases }}
          BACKUP_GENERATION: ${{ inputs.backup_generation }}
        working-directory: candidate
        run: python ../workflow/tools/resolve_r2_validation_request.py

  # ── Verify the credential once, and pin one generation for every gate ──
  #
  # Pinning here rather than per job is what makes the three gates comparable:
  # they must all judge the same immutable data. Resolved independently, a
  # publication landing mid-run would have one gate judging a generation another
  # never saw, and the disagreement would look like a bug in the engine.
  preflight:
    name: Verify read-only access and pin one generation
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: r2-validation
    outputs:
      generation: ${{ steps.pin.outputs.generation }}
      candidate_sha: ${{ needs.request.outputs.candidate_sha }}
      reviewed_sha: ${{ needs.request.outputs.reviewed_sha }}
      scope: ${{ needs.request.outputs.scope }}
      tests: ${{ needs.request.outputs.tests }}
      raw_qa_cases: ${{ needs.request.outputs.raw_qa_cases }}
      automatic: ${{ needs.request.outputs.automatic }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_VALIDATION_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_VALIDATION_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_VALIDATION_SECRET_ACCESS_KEY }}
      NBATOOLS_DATA_GENERATION: ${{ needs.request.outputs.generation }}
    steps:
      - name: Check out the resolved candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.request.outputs.candidate_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: pip install -e ".[dev,api]"

      - name: Verify read-only data access and pin one immutable generation
        id: pin
        run: |
          python - <<'PY'
          import os

          required = (
              "R2_ACCOUNT_ID",
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
          )
          # Truthiness, not membership: an environment secret that never reached
          # the job arrives as the empty string, exactly like one saved empty.
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing r2-validation environment secret(s): "
                  + ", ".join(missing)
                  + ". These are secrets on the r2-validation GitHub Environment, "
                  "and every job must declare `environment: r2-validation` to "
                  "receive them. See docs/operations/deployment.md."
              )

          from nbatools.data_source import (
              current_data_generation,
              data_glob,
              data_source_mode,
          )

          if data_source_mode() != "r2":
              raise SystemExit("DATA_SOURCE did not resolve to r2")

          generation = current_data_generation()
          if not generation or generation == "legacy":
              raise SystemExit("Validation requires an immutable generation, not legacy data")
          # Pin before probing so a pointer change cannot validate another snapshot.
          os.environ["NBATOOLS_DATA_GENERATION"] = generation
          player_game_files = data_glob("raw/player_game_stats/*.csv")
          if not player_game_files:
              raise SystemExit(
                  "R2 was reachable but the active generation exposed no "
                  "raw/player_game_stats CSVs"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"generation={generation}\n")

          print(
              "R2 read check passed; pinned generation "
              f"{generation!r} with {len(player_game_files)} player-game files"
          )
          PY

  # ── Gate 1: are the answers what they are contracted to be? ───────────
  raw-qa:
    name: Raw QA corpus against real R2 data
    needs: preflight
    if: needs.preflight.outputs.scope == 'full' || needs.preflight.outputs.raw_qa_cases != ''
    runs-on: ubuntu-latest
    # 42m30s observed on run 1 for 361 cases. Headroom for a growing corpus and
    # a slow runner, since a timeout here reports nothing at all.
    timeout-minutes: ${{ github.event_name == 'push' && 20 || 75 }}
    environment: r2-validation
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_VALIDATION_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_VALIDATION_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_VALIDATION_SECRET_ACCESS_KEY }}
      NBATOOLS_DATA_GENERATION: ${{ needs.preflight.outputs.generation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,api]"

      - name: Run Raw QA (full corpus, or the named cases when targeted)
        env:
          SCOPE: ${{ needs.preflight.outputs.scope }}
          RAW_QA_CASES: ${{ needs.preflight.outputs.raw_qa_cases }}
        run: |
          selection=""
          if [ "$SCOPE" = "targeted" ]; then
            for case_id in $RAW_QA_CASES; do
              if ! [[ "$case_id" =~ ^[A-Za-z0-9_.-]+$ ]]; then
                echo "Invalid Raw QA case id: $case_id" >&2
                exit 1
              fi
              selection="$selection --case $case_id"
            done
          fi
          make raw-query-answer-qa \
            RAW_QA_ARGS="--run-id r2_validation --overwrite-run-id$selection"

      # A targeted run is a handful of cases, so print their report rows: the
      # evidence is then readable from the log without downloading the artifact.
      - name: Print targeted Raw QA report rows
        if: always() && needs.preflight.outputs.scope == 'targeted'
        run: |
          report=outputs/raw_query_answer_qa/r2_validation/report.jsonl
          if [ -f "$report" ]; then cat "$report"; fi

      - name: Upload Raw QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-qa-${{ github.run_id }}
          path: outputs/raw_query_answer_qa/r2_validation/
          if-no-files-found: warn
          retention-days: 7

  # ── Gate 2: is any filter displayed but never applied? ────────────────
  #
  # Exit 1 is a LIED row - a filter badged as applied over an unfiltered answer.
  # Exit 2 is NO_SIGNAL: nothing was comparable, which is not a pass. Both fail
  # this job, which is the point of QA-01.
  filter-sweep:
    name: Filter execution sweep against real R2 data
    needs: preflight
    if: needs.preflight.outputs.scope == 'full'
    runs-on: ubuntu-latest
    # 521 pairs at roughly 0.75s each on run 1, so well inside this.
    timeout-minutes: 30
    environment: r2-validation
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_VALIDATION_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_VALIDATION_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_VALIDATION_SECRET_ACCESS_KEY }}
      NBATOOLS_DATA_GENERATION: ${{ needs.preflight.outputs.generation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,api]"

      - name: Run real-data filter execution sweep
        run: |
          mkdir -p outputs/filter_execution_sweep
          python tools/filter_execution_sweep.py \
            --json outputs/filter_execution_sweep/r2_validation.json

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-sweep-${{ github.run_id }}
          path: outputs/filter_execution_sweep/r2_validation.json
          if-no-files-found: warn
          retention-days: 7

  # ── Gate 3: required numerical acceptance on the same candidate ──────
  #
  # All selected needs_data tests are required. The harness rejects even a
  # partial skip, empty selection, xfail, missing data, or pytest execution error.
  # A targeted Raw-QA-only run legitimately leaves this job unselected.
  data-backed-tests:
    permissions:
      contents: read
      actions: read
    name: Required numerical tests marked needs_data
    needs: preflight
    if: needs.preflight.outputs.scope == 'full' || needs.preflight.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'push' && 20 || 60 }}
    environment: r2-validation
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_VALIDATION_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_VALIDATION_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_VALIDATION_SECRET_ACCESS_KEY }}
      NBATOOLS_DATA_GENERATION: ${{ needs.preflight.outputs.generation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,api]"

      - name: Required needs_data tests against the pinned candidate and generation
        env:
          SCOPE: ${{ needs.preflight.outputs.scope }}
          TESTS: ${{ needs.preflight.outputs.tests }}
          VALIDATION_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          VALIDATION_MAX_TESTS: ${{ needs.preflight.outputs.automatic == 'true' && '100' || '' }}
          GH_TOKEN: ${{ github.token }}
          NBATOOLS_ACQUISITION_OUTPUT: outputs/required_data_validation/acquired_data
        run: python tools/required_data_validation.py

      - name: Upload required numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-numerical-${{ github.run_id }}
          path: outputs/required_data_validation/
          if-no-files-found: warn
          retention-days: ${{ startsWith(github.ref, 'refs/heads/r2-validation/cloud-backup-') && 1 || 7 }}

  retain-data-inventory:
    name: Preserve read-only data inventory for cloud agents
    needs: [preflight, data-backed-tests]
    if: >-
      startsWith(github.ref, 'refs/heads/r2-validation/data-inventory-') &&
      needs.preflight.outputs.tests == 'tests/cloud_data_inventory_real_data.py::test_generate_production_inventory' &&
      needs.data-backed-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: required-numerical-${{ github.run_id }}
          path: evidence
      - name: Bind inventory to the validated generation
        env:
          EXPECTED_GENERATION: ${{ needs.preflight.outputs.generation }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('evidence/acquired_data/data-inventory/inventory.json').read_text())
          assert report['generation_id'] == os.environ['EXPECTED_GENERATION']
          assert report['origin'] == 'active_production_r2'
          assert report['production_writes'] == 0
          assert report['evidence']['active_pointer']['manifest_sha256'] == report['evidence']['manifest_sha256']
          assert report['file_count'] == len(report['files'])
          assert all(f['integrity'] == 'verified' for f in report['files'])
          PY
      - name: Retain permanent inventory without R2 credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Bet-Zero/nbatools
        run: >-
          gh release create "data-inventory-$GITHUB_RUN_ID"
          evidence/acquired_data/data-inventory/inventory.json
          evidence/acquired_data/data-inventory/inventory.md
          evidence/acquired_data/data-inventory/example-collection-request.json
          --target "${{ needs.preflight.outputs.candidate_sha }}"
          --title "Read-only data inventory $GITHUB_RUN_ID"
          --notes "Authenticated production-generation inventory; no R2 writes. Check generation and timestamp before use."
          --latest=false

  retain-backup:
    name: Preserve manual cloud backup independently of R2
    needs: [preflight, data-backed-tests]
    if: >-
      ((github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/r2-validation/cloud-backup-')) ||
      (inputs.backup_generation != '' && github.ref == 'refs/heads/main')) &&
      needs.preflight.outputs.tests == 'tests/cloud_operations_real_data.py::test_full_generation_backup' &&
      needs.data-backed-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No R2 environment or secrets. Existing repository token only, for this
    # backup release. No cron, production deployment or R2 publication.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: required-numerical-${{ github.run_id }}
          path: evidence
      - name: Check same-run exact backup and preserve a non-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Bet-Zero/nbatools
          EXPECTED_GENERATION: ${{ needs.preflight.outputs.generation }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('evidence/acquired_data/cloud-backup')
          receipt = json.loads((root / 'backup-receipt.json').read_text())
          if receipt['workflow_run_id'] != os.environ['GITHUB_RUN_ID'] or receipt['workflow_sha'] != os.environ['GITHUB_SHA'] or receipt['generation_id'] != os.environ['EXPECTED_GENERATION']:
              raise ValueError('Backup identity differs from this reviewed request')
          archive = root / 'generation.zip'
          if receipt['r2_writes'] != 0 or receipt['production_pointer_unchanged'] is not True or not 0 < archive.stat().st_size <= 200_000_000 or archive.stat().st_size != receipt['archive_bytes'] or hashlib.sha256(archive.read_bytes()).hexdigest() != receipt['archive_sha256']:
              raise ValueError('Backup failed the retention gate')
          PY
          gh release create "cloud-backup-$GITHUB_RUN_ID" evidence/acquired_data/cloud-backup/generation.zip evidence/acquired_data/cloud-backup/backup-receipt.json --target "$GITHUB_SHA" --title "NBA cloud backup $GITHUB_RUN_ID" --notes "Validated byte-exact read-only R2 export. Independent restore result is attached after the separate runner finishes. No production publication or scheduled refresh." --latest=false

  restore-backup:
    name: Restore durable release on a separate secret-free runner
    needs: [preflight, retain-backup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,api]"
      - name: Download permanent backup and verify offline restore without R2 credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Bet-Zero/nbatools
          DATA_SOURCE: local
        run: |
          gh release download "cloud-backup-$GITHUB_RUN_ID" --pattern generation.zip --pattern backup-receipt.json --dir recovered
          python -m tools.cloud_backup recovered/generation.zip recovered/backup-receipt.json recovered/data
          python -m tools.data_availability from-backup recovered/data --receipt recovered/backup-receipt.json --output data-inventory
          python -m tools.cloud_refresh plan --output refresh-plan.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {'state': 'not_requested', 'candidate': None, 'production_writes': 0, 'reason': 'Owner direction: laptop acquisition only; no cloud API investigation or refresh'}
          Path('freshness-receipt.json').write_text(json.dumps(result, indent=2) + '\n')
          print('CLOUD_FRESHNESS_JSON', json.dumps(result, sort_keys=True))
          # This is an explicit setup diagnostic. Failed acquisition is retained
          # as failed and cannot be treated as fresh data or a candidate.
          assert result['production_writes'] == 0
          assert result['state'] in {'failed', 'prepared_no_writes', 'not_requested'}
          if result['state'] == 'failed':
              assert result['candidate'] is None
          PY
          python - <<'PY'
          import os
          from pathlib import Path
          assert not any(os.environ.get(k) for k in ('R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY'))
          os.environ['NBATOOLS_DATA_ROOT'] = str(Path('recovered').resolve())
          os.environ.pop('NBATOOLS_DATA_GENERATION', None)
          from nbatools.data_source import data_read_csv
          rows = data_read_csv('data/raw/player_game_stats/2025-26_regular_season.csv')
          assert len(rows) > 1000 and {'player_id', 'game_id', 'pts'}.issubset(rows.columns)
          print('CLOUD_RESTORE_LOADER_ROWS', len(rows))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-restore-receipt-${{ github.run_id }}
          path: |
            restore-receipt.json
            data-inventory/
            refresh-plan.json
            freshness-receipt.json
          if-no-files-found: error
          retention-days: 7

  retain-restore-receipt:
    name: Preserve separate-runner restore result with the permanent backup
    needs: restore-backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloud-restore-receipt-${{ github.run_id }}
          path: restored
      - name: Append receipts without replacing the backup assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Bet-Zero/nbatools
        run: gh release upload "cloud-backup-$GITHUB_RUN_ID" restored/restore-receipt.json restored/refresh-plan.json restored/freshness-receipt.json restored/data-inventory/inventory.json restored/data-inventory/inventory.md
