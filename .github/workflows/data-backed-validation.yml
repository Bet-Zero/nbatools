name: Data-Backed Validation

# The validation that needs the real pinned NBA data.
#
# Ordinary CI carries no dataset, so the Raw QA corpus and the filter execution
# sweep have never run on CI infrastructure - they were local-only, on one
# machine, undated and unretained. This workflow reads the immutable R2
# generation the deployed application reads, so those two gates finally run
# somewhere automated and leave evidence behind.
#
# It is deliberately NOT on the pull_request trigger: it costs an R2 read of the
# whole generation and several minutes, and `ci.yml` already answers "is the code
# healthy" on every PR. This answers the different question of whether the
# answers are *correct*, which is a nightly/on-demand concern.
#
# Secrets required (repository Actions secrets, NOT environment secrets and NOT
# variables - the preflight below diagnoses both mistakes):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# A read-only R2 token is sufficient: the query path only calls head_object and
# get_object. Nothing in this workflow writes, publishes or deletes.
# Setup and the three ways it goes wrong:
#   docs/operations/deployment.md#github-actions-secrets
#
# DATA_SOURCE and R2_BUCKET_NAME are not secret - they are already committed in
# vercel.json - so they are set in plain sight below.

on:
  schedule:
    - cron: "41 7 * * *" # nightly, after ci.yml's 06:00 run
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: data-backed-validation
  cancel-in-progress: false

env:
  DATA_SOURCE: r2
  R2_BUCKET_NAME: nbatools-data

jobs:
  # ── Fail fast, and say exactly what is missing ────────────────────
  #
  # Without this, a misnamed or absent secret surfaces as an opaque
  # DataSourceConfigError several minutes into a Raw QA run. This names the
  # secret and stops, and it reveals nothing: it tests for emptiness only and
  # never echoes a value.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Check the R2 secrets are present
        id: check
        env:
          # Names, not values. GitHub masks secret values in logs, but this step
          # does not lean on that: it parses the JSON and emits sorted *keys*
          # only. Secret names are not sensitive, and knowing which names exist
          # is the whole difference between "something is wrong" and a fix.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARIABLES_JSON: ${{ toJSON(vars) }}
        run: |
          python - <<'PY'
          import json
          import os

          REQUIRED = ("R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY")

          secrets = json.loads(os.environ["SECRETS_JSON"])
          variables = json.loads(os.environ["VARIABLES_JSON"])

          # Truthiness, so a secret saved as an empty string is caught too. The
          # value is read here and never printed, compared or stored.
          missing = [name for name in REQUIRED if not secrets.get(name)]

          if not missing:
              print("All three R2 secrets are present.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("configured=true\n")
              raise SystemExit(0)

          # ── Diagnose, don't just complain ─────────────────────────────
          #
          # "Missing" has three very different causes with three different
          # fixes, and the owner cannot tell them apart from the failure alone.
          # github_token is dropped because every job gets it regardless.
          present = sorted(name for name in secrets if name != "github_token")
          declared = sorted(variables)

          print(f"::error::Missing repository Actions secret(s): {' '.join(missing)}")
          print()
          print(f"Secret names this job can see:   {', '.join(present) or '(none)'}")
          print(f"Variable names this job can see: {', '.join(declared) or '(none)'}")
          print()

          as_variables = [name for name in REQUIRED if name in variables]
          if as_variables:
              print(
                  "CAUSE: saved under the Variables tab instead of the Secrets "
                  f"tab: {' '.join(as_variables)}."
              )
              print(
                  "FIX: Settings -> Secrets and variables -> Actions. Delete them "
                  "from the Variables tab, then add them again under the Secrets "
                  "tab (the 'New repository secret' button)."
              )
          elif not present:
              # All three empty at once points at a systematic wrong-place
              # mistake rather than three independent typos, so these are
              # ordered by how easily each is made.
              print(
                  "CAUSE: this job can see no repository secrets at all, so they "
                  "were saved somewhere Actions cannot reach: the wrong tab, an "
                  "Environment, or another repository."
              )
              print("FIX: check these three, in this order.")
              print(
                  "  1. The wrong tab. Settings -> Secrets and variables has "
                  "three of them: Actions, Codespaces and Dependabot. Only "
                  "Actions is read by a workflow. Secrets under the other two "
                  "are invisible here and look perfectly saved."
              )
              print(
                  "  2. An Environment. An environment secret reaches only a job "
                  "that names that environment, and this workflow names none. On "
                  "the Actions tab they must sit under 'Repository secrets', not "
                  "inside an environment listed above it."
              )
              print(
                  "  3. The wrong repository or account. They must be on "
                  "Bet-Zero/nbatools itself, not a fork or a personal copy."
              )
          else:
              near = [
                  name
                  for name in present
                  if any(
                      token in name.upper()
                      for token in ("R2", "CLOUDFLARE", "ACCOUNT", "ACCESS", "SECRET", "KEY")
                  )
              ]
              print(
                  "CAUSE: repository secrets exist, but not under the three names "
                  "this workflow needs."
              )
              if near:
                  print(f"       Likely the same credentials named differently: {', '.join(near)}.")
              print(
                  "FIX: the names must match exactly, character for character: "
                  f"{', '.join(REQUIRED)}. They are the names the query engine "
                  "itself reads (REQUIRED_R2_ENV_VARS in src/nbatools/data_source.py), "
                  "so renaming the secret is the fix, not renaming the workflow."
              )

          print()
          print("A read-only Cloudflare R2 API token is sufficient for all three.")
          raise SystemExit(1)
          PY

      - run: pip install -e ".[dev,api]"

      - name: Prove the generation is reachable and name it
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          from nbatools.data_source import current_data_generation, data_glob

          print(f"active immutable generation: {current_data_generation()}")
          seasons = data_glob("data/raw/player_game_stats/*.csv")
          print(f"player_game_stats files reachable: {len(seasons)}")
          if not seasons:
              raise SystemExit(
                  "R2 is reachable but no player game logs were found. "
                  "Check R2_BUCKET_NAME and the active generation pointer."
              )
          PY

  # ── The corpus: are the answers what they are contracted to be? ───
  raw-qa:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,api]"

      - name: Full Raw QA corpus, fail-closed
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make raw-query-answer-qa

      - name: Upload the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-qa-report
          path: outputs/raw_query_answer_qa/
          retention-days: 30
          if-no-files-found: error

  # ── The sweep: is any filter displayed but never applied? ─────────
  #
  # Exit 1 means a LIED row - a filter badged as applied over an unfiltered
  # answer. Exit 2 means NO_SIGNAL: nothing was comparable, which is not a pass.
  # Both fail this job, which is the whole point of QA-01.
  filter-sweep:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,api]"

      - name: Filter execution sweep against the real generation
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python tools/filter_execution_sweep.py \
            --json outputs/filter_execution_sweep/ci.json

      - name: Upload the sweep's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-sweep-report
          path: outputs/filter_execution_sweep/
          retention-days: 30
          if-no-files-found: error

  # ── The data-backed tests that have never run anywhere automated ──
  #
  # `needs_data` tests assert real values. They skip on a local-data check, so
  # NBATOOLS_DATA_ROOT cannot satisfy them; this job runs them explicitly by
  # marker against R2 instead, and is informational on its first outings because
  # it has no prior green run to regress from.
  data-backed-tests:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,api]"

      - name: Tests marked needs_data, against the real generation
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m pytest -m needs_data -rf --no-header -q
