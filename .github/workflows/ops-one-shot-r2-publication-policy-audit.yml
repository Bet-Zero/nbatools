# Temporary operator-read-only environment-policy inspection.
# No R2 credentials, no production action, no publication; remove after run.
name: One-Time R2 Publication Environment Audit
on:
  push:
    branches:
      - ops/one-shot-r2-publication-policy-audit-20261018
    paths:
      - .github/workflows/ops-one-shot-r2-publication-policy-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.repository == 'Bet-Zero/nbatools' &&
      github.ref == 'refs/heads/ops/one-shot-r2-publication-policy-audit-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect publication environment protections without R2 credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install requests
          python tools/r2_publication.py audit --work work/publisher-policy
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("work/publisher-policy/environment-audit.json").read_text())
          print("Publication environment found:", bool(r.get("configuration")))
          print("Publication environment policy ready:", r["publication_ready"])
          print("Environment names and IDs:", [(e["name"],e["id"]) for e in r.get("environments",[])])
          if r.get("configuration"):
              c=r["configuration"]
              print("Target:", c.get("name"), c.get("id"))
              print("Administrator bypass allowed:", c.get("can_admins_bypass"))
              print("Branch rule:", c.get("deployment_branch_policy"))
              print("Branch allowlist:", [(p.get("name"),p.get("type")) for p in r.get("branches",{}).get("branch_policies",[])])
              print("Reviewer rules:", [(x.get("type"),[(i.get("type"),i.get("reviewer",{}).get("login")) for i in x.get("reviewers",[])]) for x in c.get("protection_rules",[])])
          if r.get("blocker"):
              print("Policy blocker:",r["blocker"])
          PY
