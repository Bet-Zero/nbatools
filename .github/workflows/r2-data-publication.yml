name: Protected R2 Data Publication
run-name: "${{ inputs.mode }} reviewed data package ${{ inputs.package }}"

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Reviewed package ID from .github/data-publication-packages.json"
        type: string
        required: true
        default: opening-availability-v1
      mode:
        description: "Validate never writes. Publish additionally requires owner environment approval."
        type: choice
        required: true
        default: validate
        options: [validate, publish]

permissions:
  contents: read
  actions: read

concurrency:
  group: r2-data-publication
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'Bet-Zero/nbatools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publisher_sha: ${{ steps.package.outputs.publisher_sha }}
      generation_id: ${{ steps.package.outputs.generation_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Require reviewed merged main and successful post-merge CI
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          PUBLICATION_MODE: ${{ inputs.mode }}
        run: python tools/r2_publication.py resolve --package "$PACKAGE"

  prepare:
    needs: resolve
    uses: ./.github/workflows/r2-publication-readonly.yml
    with:
      publication_package: ${{ inputs.package }}
      publication_mode: prepare
      publication_publisher_sha: ${{ needs.resolve.outputs.publisher_sha }}
    secrets:
      R2_VALIDATION_ACCOUNT_ID: ${{ secrets.R2_VALIDATION_ACCOUNT_ID }}
      R2_VALIDATION_ACCESS_KEY_ID: ${{ secrets.R2_VALIDATION_ACCESS_KEY_ID }}
      R2_VALIDATION_SECRET_ACCESS_KEY: ${{ secrets.R2_VALIDATION_SECRET_ACCESS_KEY }}

  publish:
    name: "Owner approval: ${{ inputs.package }} → ${{ needs.resolve.outputs.generation_id }}"
    needs: [resolve, prepare]
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: r2-publication
      url: https://github.com/Bet-Zero/nbatools/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.publisher_sha }}
          path: publisher
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e "publisher[api]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-prepared-${{ github.run_id }}
          path: approved
      - name: Recheck owner approval and exact snapshot, then invoke existing immutable publisher
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          R2_BUCKET_NAME: nbatools-data
          R2_ACCOUNT_ID: ${{ secrets.R2_PUBLICATION_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_PUBLICATION_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLICATION_SECRET_ACCESS_KEY }}
        run: >-
          python tools/r2_publication.py publish --package "$PACKAGE"
          --publisher publisher --prepared approved/prepared/prepared.json --work work/published
      - name: Retain publication outcome without credentials or full snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-result-${{ github.run_id }}
          path: |
            work/published/publication.json
            work/published/prepared.json
          retention-days: 30
          if-no-files-found: warn

  verify:
    needs: [resolve, publish]
    if: inputs.mode == 'publish' && needs.publish.result == 'success'
    uses: ./.github/workflows/r2-publication-readonly.yml
    with:
      publication_package: ${{ inputs.package }}
      publication_mode: verify
      publication_publisher_sha: ${{ needs.resolve.outputs.publisher_sha }}
    secrets:
      R2_VALIDATION_ACCOUNT_ID: ${{ secrets.R2_VALIDATION_ACCOUNT_ID }}
      R2_VALIDATION_ACCESS_KEY_ID: ${{ secrets.R2_VALIDATION_ACCESS_KEY_ID }}
      R2_VALIDATION_SECRET_ACCESS_KEY: ${{ secrets.R2_VALIDATION_SECRET_ACCESS_KEY }}

  backup:
    name: Back up owner-approved generation after live verification
    needs: [resolve, verify]
    if: inputs.mode == 'publish' && needs.verify.result == 'success'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/r2-real-data-validation.yml
    with:
      publication_package: ""
      publication_mode: ""
      publication_publisher_sha: ""
      backup_generation: ${{ needs.resolve.outputs.generation_id }}
    secrets:
      R2_VALIDATION_ACCOUNT_ID: ${{ secrets.R2_VALIDATION_ACCOUNT_ID }}
      R2_VALIDATION_ACCESS_KEY_ID: ${{ secrets.R2_VALIDATION_ACCESS_KEY_ID }}
      R2_VALIDATION_SECRET_ACCESS_KEY: ${{ secrets.R2_VALIDATION_SECRET_ACCESS_KEY }}

  receipt:
    name: Preserve durable publication receipt
    needs: [publish, verify]
    if: always() && inputs.mode == 'publish' && (needs.publish.result == 'success' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-result-${{ github.run_id }}
          path: outcome
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.verify.result == 'success' || needs.verify.result == 'failure'
        continue-on-error: true
        with:
          name: publication-verified-${{ github.run_id }}
          path: verified
      - name: Serialize receipt and preserve it in a dedicated data receipt release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Bet-Zero/nbatools
          VERIFIED: ${{ needs.verify.result }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('verified/receipt.json')
          value = json.loads((source if source.exists() else Path('outcome/publication.json')).read_text())
          if value['workflow_run_id'] != os.environ['GITHUB_RUN_ID'] or value['workflow_sha'] != os.environ['GITHUB_SHA']:
              raise ValueError('Receipt does not belong to this reviewed workflow')
          if os.environ['VERIFIED'] != 'success' and value['publication_state'] != 'publication_started_outcome_unknown':
              value['publication_state'] = 'published_verification_failed'
          Path('receipt.json').write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          Path('receipt.md').write_text('Publication outcome: ' + value['publication_state'] + '\n\nRun: https://github.com/Bet-Zero/nbatools/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n\nThe attached receipt records source, code, snapshot checksums and verification. Previous generation is retained; no pruning was performed.\n')
          PY
          gh release create "data-publication-$GITHUB_RUN_ID" receipt.json --target "$GITHUB_SHA" --title "NBA data publication receipt $GITHUB_RUN_ID" --notes-file receipt.md --latest=false
