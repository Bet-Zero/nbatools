name: CI

# ── Trigger policy ────────────────────────────────────────────────
#
#   pull_request  → lint + docs-governance + frontend-verify
#                   + frontend-security + test-fast
#   push to main  → the above + test-full
#   nightly       → the above + test-full
#   manual        → the above + test-full
#
# Frontend code verification and frontend dependency security are two
# independent jobs on purpose.  `frontend-verify` reports whether the
# code builds and passes lint/tests; `frontend-security` reports
# whether the dependency tree carries known advisories.  Neither job
# depends on the other, so an advisory published upstream can turn the
# security verdict red without erasing the code verdict — the failure
# mode this split exists to prevent.
#
# All test jobs call Makefile targets so the repo owns the pytest
# flags.  See AGENTS.md § "CI testing policy" and CONTRIBUTING.md
# § "Continuous Integration" for the full rationale.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # nightly at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src/ tests/ tools/
      - run: ruff format --check src/ tests/ tools/

  docs-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: make docs-governance

  # ── Frontend verification ────────────────────────────────────────
  # Answers one question: does the frontend source build, lint, and
  # pass its tests?  This job deliberately contains no dependency
  # audit.  A newly published npm advisory must never stop the repo
  # from learning whether the code itself is healthy.
  frontend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test

  # ── Frontend dependency security ─────────────────────────────────
  # Answers a different question: does the installed dependency tree
  # contain known advisories?  Runs on every trigger, so a PR that
  # changes dependencies always gets an audit verdict and the nightly
  # run still catches advisories published after a lockfile was merged.
  #
  # Two verdicts, because two different questions are being asked and
  # only one of them should be able to stop a merge (CI-SEC-01,
  # owner-approved 2026-09-27).
  #
  # `frontend-security` audits the dependencies actually shipped to a
  # visitor's browser.  An advisory there is reachable by real users, so
  # this job stays strict and blocking: --audit-level=low,
  # unconditional, no continue-on-error, no exit-code suppression, no
  # advisory ignores.  If it is red, the tree needs a fix — not a
  # softer policy.
  #
  # `frontend-security-dev` audits the whole tree, development
  # dependencies included.  The test runner, linter and bundler never
  # reach a visitor, so an advisory in one cannot affect anyone using
  # the app.  Between 2026-08 and 2026-09 three such advisories each
  # held CI red for weeks while nothing about this repository's own code
  # had changed, and the red obscured whether the code was healthy.
  # This job therefore reports rather than blocks: it still runs on
  # every trigger, still audits the full tree, and still pins
  # --audit-level=low, so nothing is hidden — it simply cannot mark the
  # repository broken on its own.
  #
  # Whether GitHub itself disables the merge button is a separate
  # matter: that needs branch protection or a repository ruleset naming
  # this check, which is not configured here (CI-GOV-01).
  #
  # `tests/test_ci_workflow_policy.py` pins both halves of this
  # contract, including that exactly one audit job is blocking and that
  # it is the production-scoped one.
  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend audit --omit=dev --audit-level=low

  frontend-security-dev:
    runs-on: ubuntu-latest
    # Informational by design: development-only advisories are reported,
    # not merge-blocking.  Declared here in the workflow rather than
    # hidden behind a shell `|| true`, so the policy test can see it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend audit --audit-level=low

  # ── Fast feedback ────────────────────────────────────────────────
  # Runs on every trigger.  Uses `make test-unit` which excludes
  # slow and data-dependent tests and runs in parallel via xdist.
  test-fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,api]"
      - run: make test-unit

  # ── Full regression suite ────────────────────────────────────────
  # Runs on push to main, nightly schedule, and manual dispatch.
  # Skipped on pull requests to keep PR feedback fast.
  # Uses `make test` which runs the entire suite in parallel.
  test-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,api]"
      - run: make test
